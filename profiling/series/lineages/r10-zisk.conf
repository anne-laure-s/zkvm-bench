# r10-zisk — the branch stack that will be merged, rebased onto main rather than onto r10.
#
#   main (1ce42ff76)
#     └─ 23 commits ─► c8ed5ed4a
#          ├─ +5 ─► al/zkvm-r10-zisk-soundness ─ +4 ─► al/zkvm-r10-zisk-build ─► (more to come)
#          └─ +17 ─► al/zkvm-r10-zisk-optimizations   (temporary, deliberately NOT walked)
#
# BRANCH names the TOP of the stack, not each of its branches: every branch of a stack contains
# the ones below it, so walking to the top walks them all, in order, once. Move this line up as
# branches are added; nothing else here changes.
LINEAGE_BRANCH="${LINEAGE_BRANCH:-origin/al/zkvm-r10-zisk-arith}"
# The base is the DENOMINATOR of the whole series: every ratio is that commit's build, and the
# curve shows what the stack itself contributed rather than what it inherited. dd1e32889
# ("zkvm: precompile golden-vector test harness") is commit 22 of the 32 since main, so the walk
# is the last 10 -- the soundness binding, its five follow-ups, the audited profile and the three
# build commits. The 21 before it are shared prefix and are not this stack's work.
LINEAGE_BASE="${LINEAGE_BASE:-subject:zkvm: precompile golden-vector test harness}"
# EMPTY, unlike r10: the stack is rooted at a recent main, so no commit in it predates the
# libc/libgcc fix. Cherry-picking r10's onto 32 commits that already have its effect would
# conflict on every one of them.
LINEAGE_BUILDFIX="${LINEAGE_BUILDFIX:-}"
LINEAGE_AXIS="${LINEAGE_AXIS:-r10zisk-tip-vs-ziskethone}"
LINEAGE_SERIES_OUT="${LINEAGE_SERIES_OUT:-results/series-r10-zisk.html}"
LINEAGE_COMPARE_OUT="${LINEAGE_COMPARE_OUT:-results/compare-r10-zisk.html}"
# The stack writes the digest tag as 0xa0 (its own RLP prefix) where r10 writes 0x04, so it needs
# the corpus minted from al/rtp. Same 200 blocks and the same post-state roots as r10's canonical
# set -- measured, the two differ in exactly one byte VALUE, 83,231 times in a 6.5 MB witness --
# but a guest of either branch aborts on the other's encoding.
LINEAGE_GEN="${LINEAGE_GEN:-r10zisk-rtp-25815000-25815199-cb7b6b1ae}"
LINEAGE_GEN_DIGEST="${LINEAGE_GEN_DIGEST:-d3fb84e4ba095c369d2f47b5b5650fc405c33201d34317e806e17155ad865ef1}"
# Every ref of the stack, as a glob under refs/remotes. The preflight refuses to run when one of
# them is strictly ahead of LINEAGE_BRANCH: that is the day a branch was pushed on top and this
# file was not moved with it.
LINEAGE_STACK_REFS="${LINEAGE_STACK_REFS:-origin/al/zkvm-r10-zisk-*}"
