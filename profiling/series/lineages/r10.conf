# r10 — the lineage this driver was written for. Values unchanged from when they were
# constants in run-r10.sh; this file exists so a second lineage needs no second driver.
LINEAGE_BRANCH="${LINEAGE_BRANCH:-origin/al/zkvm-r10}"
LINEAGE_BASE="${LINEAGE_BASE:-3d237fe69}"
# The guest CMakeLists queries libc/libgcc without -march before this commit, and a multilib
# toolchain answers rv32. Cherry-picked onto every ancestor that predates it.
LINEAGE_BUILDFIX="${LINEAGE_BUILDFIX:-142989e81}"
LINEAGE_AXIS="${LINEAGE_AXIS:-r10tip-vs-ziskethone}"
LINEAGE_SERIES_OUT="${LINEAGE_SERIES_OUT:-results/series-r10.html}"
LINEAGE_COMPARE_OUT="${LINEAGE_COMPARE_OUT:-results/compare.html}"
# The witness generation this lineage's guest can read. Its digest is checked, not trusted: the
# `fixtures` symlink is global, and a run pointed at another generation would measure a corpus
# nobody named.
LINEAGE_GEN="${LINEAGE_GEN:-canonical-2026-08-25815000-25815199-d49075fa3}"
LINEAGE_GEN_DIGEST="${LINEAGE_GEN_DIGEST:-5bc3267f24399a18b2554ca6e0d92a738bad5daa8502a7c5438e45d9de263e5f}"
